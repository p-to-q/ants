horizons = [24, 36, 48, 60]
note = "CDC FluView weekly ILI, 966 rows x 7 variables; very short, so conclusions are weak. md5 verified against the maintainers of the community copy."
source = "https://gis.cdc.gov/grasp/fluview/fluportaldashboard.html"
license = "US government public data (CDC); community mirror used for the file"

[dataset.solar]
