[dataset.weather]
family = "Weather"
role = "dev"
raw = "raw/weather_primary"
format = "mpi_roof_zip"
split = [0.7, 0.1, 0.2]
ref_period = 144
note = "Max Planck Institute for Biogeochemistry, Jena, Beutenberg roof station 2020, 10-minute, 21 variables, 52,696 rows. Benchmark-faithful: keeps 81 sentinel values (-9999) exactly as the published LTSF file does (verified value-identical to the community copy)."
source = "https://www.bgc-jena.mpg.de/wetter/"
license = "CC BY 4.0"

[dataset.weather_clean]
family = "Weather"
role = "stress"
raw = "raw/weather_primary"
format = "mpi_roof_zip"
clean_sentinels = true
split = [0.7, 0.1, 0.2]
ref_period = 144
note = "Same series with -9999 sentinels replaced by the previous valid value. Not comparable to published tables; used to measure how much the faithful version's artefacts matter."
source = "https://www.bgc-jena.mpg.de/wetter/"
license = "CC BY 4.0"

[dataset.exchange]
family = "FX"
role = "dev"
raw = "raw/exchange/exchange_rate.txt.gz"
format = "lstnet_gz"
split = [0.7, 0.1, 0.2]
ref_period = 1
note = "Daily exchange rates of 8 countries; no seasonality (naive reference = last value)."
source = "https://github.com/laiguokun/multivariate-time-series-data"
license = "see source repository (LSTNet, Lai et al. 2018)"

[dataset.ili]
family = "Epidemic"
role = "confirm"
raw = "raw/illness_mirror/illness.zip"
