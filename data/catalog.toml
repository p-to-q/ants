# Data catalog = the protocol. Roles are fixed by this file; no agent or LLM may choose datasets (changing a role starts a new
# evaluation epoch for contracts that list this file in code_paths). "family" = independent source: correlated datasets share a family and are weighted once.
#   dev      used by the search (cascade stages) on VALIDATION windows only
#   confirm  used by E2 confirmation (paired tests); never by the search loop
#   sealed   whole families untouched until the one-shot final evaluation (E7)
#   stress   synthetic/extreme suites for gates and robustness; never mixed into the headline
# Splits are chronological fractions of the series (train/val/test); ETT uses the standard 12/4/4 months.

[defaults]
horizons = [96, 192, 336, 720]

[dataset.etth1]
use_rows = 14400
family = "ETT"
role = "dev"
raw = "raw/etth1/ETTh1.csv"
format = "ett_csv"
split = [8640, 2880, 2880]
ref_period = 24
source = "https://github.com/zhouhaoyi/ETDataset"
license = "CC BY 4.0 (as stated by the repository maintainers; verify before redistribution)"

[dataset.etth2]
use_rows = 14400
family = "ETT"
role = "confirm"
raw = "raw/etth2/ETTh2.csv"
format = "ett_csv"
split = [8640, 2880, 2880]
ref_period = 24
source = "https://github.com/zhouhaoyi/ETDataset"
license = "CC BY 4.0 (as above)"

[dataset.ettm1]
use_rows = 57600
family = "ETT"
role = "dev"
raw = "raw/ettm1/ETTm1.csv"
format = "ett_csv"
