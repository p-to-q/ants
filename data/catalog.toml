ref_period = 96
source = "https://github.com/zhouhaoyi/ETDataset"
license = "CC BY 4.0 (as above)"

[dataset.ettm2]
use_rows = 57600
family = "ETT"
role = "confirm"
raw = "raw/ettm2/ETTm2.csv"
