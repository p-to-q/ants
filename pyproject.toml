[project]
name = "ants-lab"
version = "0.3.0"
description = "ants: Autonomous Navigation of Tiny-model Space. A small autonomous research loop: it starts on one cheap machine and scales with the compute you give it."
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = []

[project.optional-dependencies]
gyms = ["numpy>=1.26", "scipy>=1.11"]          # forecasting gyms, circle-packing calibration gym
search = ["optuna>=3.6"]                        # TPE operator / baseline arm
s3 = ["boto3>=1.34"]                            # Tencent COS (S3-compatible) archive backend
artifact = ["onnx>=1.16", "onnxruntime>=1.18"]  # E3 artifact checks (export parity, latency); promotion time only
nn = ["torch>=2.3"]                             # nonlinear levers (dev machine / bigger workers; NOT needed on the 2 GB control tower)
export = ["pyarrow>=16", "zstandard>=0.22"]     # parquet export of the ledger, zstd log archives
ops = ["psutil>=5.9", "certifi>=2024.2"]        # health checks (doctor); CA bundle for HTTPS on Pythons without one
ml = ["scikit-learn>=1.4"]                      # surrogate models / judge fallbacks
dev = ["pytest>=8"]

[project.scripts]
ants = "antslab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: chaos/soak tests"]
