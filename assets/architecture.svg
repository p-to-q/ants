<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 384" width="900" role="img" aria-label="Propose, judge, execute"><rect width="900" height="384" rx="16" fill="#f5f5f3"/><text x="32.0" y="58.0" font-family="Inter,'Inter Variable',ui-sans-serif,-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="28" fill="#1b1d1b" text-anchor="start" font-weight="600" letter-spacing="-0.7" style="font-variant-numeric:tabular-nums;font-feature-settings:'tnum'">Propose, judge, execute</text><text x="32.0" y="86.0" font-family="Inter,'Inter Variable',ui-sans-serif,-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#7d827c" text-anchor="start" font-weight="400" letter-spacing="0" style="font-variant-numeric:tabular-nums;font-feature-settings:'tnum'">Proposers can only hand specs to the judge.</text><line x1="250.0" x2="250.0" y1="110" y2="282" stroke="#1b1d1b" stroke-width="1" stroke-dasharray="3 3"/><rect x="32" y="124" width="196" height="144" rx="12" fill="#fcfcfb" stroke="#e2e4df" stroke-width="1"/><text x="60.0" y="170.0" font-family="Inter,'Inter Variable',ui-sans-serif,-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="17" fill="#1b1d1b" text-anchor="start" font-weight="600" letter-spacing="-0.3" style="font-variant-numeric:tabular-nums;font-feature-settings:'tnum'">Propose</text><text x="60.0" y="206.0" font-family="Inter,'Inter Variable',ui-sans-serif,-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4d524d" text-anchor="start" font-weight="400" letter-spacing="0" style="font-variant-numeric:tabular-nums;font-feature-settings:'tnum'">Suggests specs and is</text><text x="60.0" y="227.0" font-family="Inter,'Inter Variable',ui-sans-serif,-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4d524d" text-anchor="start" font-weight="400" letter-spacing="0" style="font-variant-numeric:tabular-nums;font-feature-settings:'tnum'">trusted with nothing.</text><rect x="272" y="124" width="292" height="144" rx="12" fill="#a8e6d7" stroke="#a8e6d7" stroke-width="1"/><text x="300.0" y="170.0" font-family="Inter,'Inter Variable',ui-sans-serif,-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="17" fill="#1b1d1b" text-anchor="start" font-weight="600" letter-spacing="-0.3" style="font-variant-numeric:tabular-nums;font-feature-settings:'tnum'">Judge</text><text x="300.0" y="206.0" font-family="Inter,'Inter Variable',ui-sans-serif,-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#1b1d1b" text-anchor="start" font-weight="400" letter-spacing="0" style="font-variant-numeric:tabular-nums;font-feature-settings:'tnum'">Validates, prices, evaluates</text><text x="300.0" y="227.0" font-family="Inter,'Inter Variable',ui-sans-serif,-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#1b1d1b" text-anchor="start" font-weight="400" letter-spacing="0" style="font-variant-numeric:tabular-nums;font-feature-settings:'tnum'">and records every spec.</text><rect x="616" y="124" width="252" height="144" rx="12" fill="#fcfcfb" stroke="#e2e4df" stroke-width="1"/><text x="644.0" y="170.0" font-family="Inter,'Inter Variable',ui-sans-serif,-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="17" fill="#1b1d1b" text-anchor="start" font-weight="600" letter-spacing="-0.3" style="font-variant-numeric:tabular-nums;font-feature-settings:'tnum'">Execute</text><text x="644.0" y="206.0" font-family="Inter,'Inter Variable',ui-sans-serif,-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4d524d" text-anchor="start" font-weight="400" letter-spacing="0" style="font-variant-numeric:tabular-nums;font-feature-settings:'tnum'">Runs each trial in its own</text><text x="644.0" y="227.0" font-family="Inter,'Inter Variable',ui-sans-serif,-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4d524d" text-anchor="start" font-weight="400" letter-spacing="0" style="font-variant-numeric:tabular-nums;font-feature-settings:'tnum'">sandboxed process.</text><circle cx="564" cy="183.0" r="3.2" fill="#1b1d1b"/><line x1="564" x2="614" y1="183.0" y2="183.0" stroke="#1b1d1b" stroke-width="1.8" stroke-linecap="round"/><path d="M609.5,177.5 L616,183.0 L609.5,188.5" fill="none" stroke="#1b1d1b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="616" cy="209.0" r="3.2" fill="#1b1d1b"/><line x1="616" x2="566" y1="209.0" y2="209.0" stroke="#1b1d1b" stroke-width="1.8" stroke-linecap="round"/><path d="M570.5,203.5 L564,209.0 L570.5,214.5" fill="none" stroke="#1b1d1b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="32" y="304" width="836" height="48" rx="12" fill="#fcfcfb" stroke="#e2e4df" stroke-width="1"/><circle cx="130.0" cy="268" r="3.2" fill="#1b1d1b"/><line x1="130.0" x2="130.0" y1="268" y2="301" stroke="#1b1d1b" stroke-width="1.8" stroke-linecap="round"/><path d="M124.5,296.5 L130.0,303 L135.5,296.5" fill="none" stroke="#1b1d1b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="418.0" cy="268" r="3.2" fill="#1b1d1b"/><line x1="418.0" x2="418.0" y1="268" y2="301" stroke="#1b1d1b" stroke-width="1.8" stroke-linecap="round"/><path d="M412.5,296.5 L418.0,303 L423.5,296.5" fill="none" stroke="#1b1d1b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="742.0" cy="268" r="3.2" fill="#1b1d1b"/><line x1="742.0" x2="742.0" y1="268" y2="301" stroke="#1b1d1b" strok