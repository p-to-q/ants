#4d524d" text-anchor="start" font-weight="400" letter-spacing="0" style="font-variant-numeric:tabular-nums;font-feature-settings:'tnum'">trusted with nothing.</text><text x="304.0" y="170.0" font-family="Inter,'Inter Variable',ui-sans-serif,-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="17" fill="#1b1d1b" text-anchor="start" font-weight="600" letter-spacing="-0.3" style="font-variant-numeric:tabular-nums;font-feature-settings:'tnum'">Judge</text><text x="304.0" y="206.0" font-family="Inter,'Inter Variable',ui-sans-serif,-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#1b1d1b" text-anchor="start" font-weight="400" letter-spacing="0" style="font-variant-numeric:tabular-nums;font-feature-settings:'tnum'">Validates, prices, evaluates</text><text x="304.0" y="227.0" font-family="Inter,'Inter Variable',ui-sans-serif,-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#1b1d1b" text-anchor="start" font-weight="400" letter-spacing="0" style="font-variant-numeric:tabular-nums;font-feature-settings:'tnum'">and records every spec.</text><text x="620.0" y="170.0" font-family="Inter,'Inter Variable',ui-sans-serif,-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="17" fill="#1b1d1b" text-anchor="start" font-weight="600" letter-spacing="-0.3" style="font-variant-numeric:tabular-nums;font-feature-settings:'tnum'">Execute</text><text x="620.0" y="206.0" font-family="Inter,'Inter Variable',ui-sans-serif,-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4d524d" text-anchor="start" font-weight="400" letter-spacing="0" style="font-variant-numeric:tabular-nums;font-feature-settings:'tnum'">Runs each trial in its own</text><text x="620.0" y="227.0" font-fami