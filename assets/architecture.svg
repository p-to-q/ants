<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 384" width="900" role="img" aria-label="Propose, judge, execute"><rect width="900" height="384" rx="16" fill="#f5f5f3"/><text x="32.0" y="58.0" font-family="Inter,'Inter Variable',ui-sans-serif,-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="28" fill="#1b1d1b" text-anchor="start" font-weight="600" letter-spacing="-0.7" style="font-variant-numeric:tabular-nums;font-feature-settings:'tnum'">Propose, judge, execute</text><text x="32.0" y="86.0" font-family="Inter,'Inter Variable',ui-sans-serif,-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#7d827c" text-anchor="start" font-weight="400" letter-spacing="0" style="font-variant-numeric:tabular-nums;font-feature-settings:'tnum'">Proposers can only hand specs to the judge.</text><line x1="250.0" x2="250.0" y1="110" y2="282" stroke="#1b1d1b" stroke-width="1" stroke-dasharray="3 3"/><rect x="32" y="124" width="196" height="144" rx="12" fill="#fcfcfb" stroke="#e2e4df" stroke-width="1"/><text x="60.0" y="170.0" font-family="Inter,'Inter Variable',ui-sans-serif,-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="17" fill="#1b1d1b" text-anchor="start" font-weight="600" letter-spacing="-0.3" style="font-variant-numeric:tabular-nums;font-feature-settings:'tnum'">Propose</text><text x="60.0" y="206.0" font-family="Inter,'Inter Variable',ui-sans-serif,-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4d524d" text-anchor="start" font-weight="400" letter-spacing="0" style="font-variant-numeric:tabular-nums;font-feature-settings:'tnum'">Suggests specs and is</text><text x="60.0" y="227.0" font-family="Inter,'Inter Variable',ui-sans-serif,-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#4d524d" text-anchor="start" font-weight="400" letter-spacing="0" style="font-variant-numeric:tabular-nums;font-feature-settings:'tnum'">trusted with nothing.</text><rect x="272" y="124" width="300" height="144" rx="12" fill="#a8e6d7" stroke="#a8e6d7" stroke-width="1"/><text x="300.0" y="170.0" font-family="Inter,'Inter Variable',ui-sans-serif,-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="17" fill="#1b1d1b" text-anchor="start" font-weight="600" letter-spacing="-0.3" style="font-variant-numeric:tabular-nums;font-feature-settings:'tnum'">Judge</text><text x="300.0" y="206.0" font-family="Inter,'Inter Variable',ui-sans-serif,-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#1b1d1b" text-anchor="start" font-weight="400" letter-spacing="0" style="font-variant-numeric:tabular-nums;font-feature-settings:'tnum'">Validates, prices, evaluates</text><text x="300.0" y="227.0" font-family="Inter,'Inter Variable',ui-sans-serif,-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#1b1d1b" text-anchor="start" font-weight="400" letter-spacing="0" style="font-variant-numeric:tabular-nums;font-feature-settings:'tnum'">and records every spec.</text><rect x="608" y="124" width="260" height="144" rx="12" fill="#fcfcfb" stroke="#e2e4df" stroke-width="1"/><text x="636.0" y="170.0" font-family="Inter,'Inter Variable',ui-sans-serif,-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="17" fill="#1b1d1b" text-anchor="start" font-weight="600" letter-spacing="-0.3" style="font-variant-numeric:tabular-nums;font-feature-settings:'tnum'">Execute</text><text x="636.0" y="206.0" font-family="Inter,'Inter Variable',ui-sans-serif,-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica N