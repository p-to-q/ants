name: release
on:
  push:
    tags: ["v*"]
permissions: { contents: read }
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: tag matches the versions in the repository
        run: |
          tag="${GITHUB_REF_NAME#v}"
          npm_v=$(node -p "require('./package.json').version")
          py_v=$(python3 - <<'PY'
          import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])
          PY
          )
          echo "tag=$tag package.json=$npm_v pyproject=$py_v"
          [ "$tag" = "$npm_v" ] && [ "$tag" = "$py_v" ]
      - name: install the Python package from the release tree
        run: python -m pip install --no-deps .
      - name: install the version comparison helper
        run: python -m pip install packaging
      - name: verify Python package metadata and CLI
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          expected_version=$(python - <<'PY'
          import os
          from importlib.metadata import version
          from packaging.version import Version
          import antslab
          installed = Version(version("ants-lab"))
          tagged = Version(os.environ["RELEASE_VERSION"].removeprefix("v"))
          assert installed == tagged, f"installed {installed} does not match tag {tagged}"
          print(installed)
          PY
          )
          cli_version=$(python -m antslab.cli --version)
          [ "$cli_version" = "ants $expected_version" ]
      - run: npm pack --dry-run
